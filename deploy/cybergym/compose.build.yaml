# Optional build override for the runner image.
#
# The deployment bundle ships prebuilt images in deploy/images/. Use this file
# only when you want to rebuild from the repository source:
#
#   docker compose -f deploy/cybergym/compose.yaml \
#                  -f deploy/cybergym/compose.build.yaml build
#
# The build context is the repository root, so run it from a full checkout.

services:
  cybergym-batch:
    build:
      context: ../..
      dockerfile: deploy/cybergym/Dockerfile.runner
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:27-cli}
